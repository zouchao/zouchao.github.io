<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">vagrant box add</text>
  <rect x="886" y="88" width="14" height="66" rx="2" fill="#34d399" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">laravel/homestead · 下载中断 · 断点续传</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">virtualbox.box → hc-download</text>

  <!-- main terminal -->
  <rect x="80" y="250" width="720" height="570" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="800" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="440" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">~/Code — zsh</text>

  <rect x="100" y="310" width="680" height="38" rx="8" fill="#34d399" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="112" y="336"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> vagrant box add laravel/homestead</tspan></text>

    <text x="112" y="390"><tspan fill="#f472b6">SSL read: error:00000000:lib(0):</tspan></text>
    <text x="112" y="418"><tspan fill="#f472b6">  func(0):reason(0), errno 54</tspan></text>

    <text x="112" y="466"><tspan fill="#fbbf24">HTTP server doesn't support byte ranges.</tspan></text>
    <text x="112" y="494"><tspan fill="#fbbf24">  Cannot resume.</tspan></text>

    <text x="112" y="542"><tspan fill="#f472b6">bsdtar: Error opening archive:</tspan></text>
    <text x="112" y="570"><tspan fill="#f472b6">  gzip decompression failed</tspan></text>
  </g>

  <!-- separator -->
  <line x1="112" y1="600" x2="768" y2="600" stroke="#27385e" stroke-width="1"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="112" y="636" fill="#5d6f92"># 清理临时文件重试</text>
    <text x="112" y="672"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> rm ~/.vagrant.d/tmp/*</tspan></text>
    <text x="112" y="720" fill="#5d6f92"># 断点续传（不稳定）</text>
    <text x="112" y="756"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> vagrant box add laravel/homestead </tspan><tspan fill="#fbbf24" font-weight="700">-c</tspan></text>
  </g>

  <!-- right side cards -->
  <rect x="840" y="250" width="680" height="180" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">
    <text x="872" y="300"> 坑 1 · 下载工具篡改文件名</text>
  </g>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="872" y="340"><tspan fill="#f472b6">virtualbox.box</tspan><tspan fill="#94a3b8">  ← p2p 离线下载产出</tspan></text>
    <text x="872" y="372"><tspan fill="#34d399">hc-download</tspan><tspan fill="#94a3b8">     ← 正确文件名格式</tspan></text>
    <text x="872" y="404"><tspan fill="#94a3b8">下载完再改后缀为 .box，禁用离线/高速通道</tspan></text>
  </g>

  <rect x="840" y="460" width="680" height="180" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">
    <text x="872" y="510"> 坑 2 · 网络中断无法续传</text>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#94a3b8">
    <text x="872" y="550">vagrant 默认不支持断点续传</text>
    <text x="872" y="582">-c 参数在弱网下多次尝试后仍会失败</text>
    <text x="872" y="614">推荐直接用 p2p 下载 .box 文件后手动添加</text>
  </g>

  <rect x="840" y="670" width="680" height="150" rx="14" fill="#101a31" stroke="#27385e" stroke-width="1.5"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">
    <text x="872" y="720"> 前置依赖</text>
  </g>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="872" y="760"><tspan fill="#60a5fa">VirtualBox</tspan><tspan fill="#94a3b8">  virtualbox.org/wiki/Downloads</tspan></text>
    <text x="872" y="792"><tspan fill="#60a5fa">Vagrant</tspan><tspan fill="#94a3b8">     vagrantup.com/downloads.html</tspan></text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 800 400 C 820 400, 820 340, 840 340"/>
    <path d="M 800 560 C 820 560, 820 550, 840 550"/>
    <path d="M 800 740 C 820 740, 820 745, 840 745"/>
  </g>
</svg>
