<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">webp-ffi</text>
  <rect x="516" y="88" width="14" height="66" rx="2" fill="#fbbf24" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">libwebp 编译 · gem 安装 · ldconfig 修复</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">/etc/ld.so.conf.d/user_local.conf</text>

  <!-- ================= LEFT: Build steps terminal ================= -->
  <rect x="80" y="250" width="680" height="570" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="760" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="420" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">terminal — build libwebp</text>

  <!-- highlighted row -->
  <rect x="100" y="568" width="640" height="38" rx="8" fill="#34d399" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <!-- Step 1: deps -->
    <text x="112" y="348" fill="#94a3b8"># 1. 安装依赖</text>
    <text x="112" y="380"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> sudo yum install</tspan></text>
    <text x="112" y="412"><tspan fill="#fbbf24">  libjpeg-devel libpng-devel</tspan></text>
    <text x="112" y="444"><tspan fill="#fbbf24">  libtiff-devel</tspan></text>

    <!-- Step 2: build -->
    <text x="112" y="500" fill="#94a3b8"># 2. 编译 libwebp</text>
    <text x="112" y="532"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> ./configure &amp;&amp; make</tspan></text>
    <text x="112" y="594"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> sudo make install</tspan></text>

    <!-- Step 3: gem -->
    <text x="112" y="658" fill="#94a3b8"># 3. 安装 gem</text>
    <text x="112" y="690"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> gem install webp-ffi</tspan></text>
  </g>

  <!-- Step chips -->
  <rect x="112" y="730" width="140" height="50" rx="10" fill="#1c2a4d" stroke="#fbbf24" stroke-opacity="0.55"/>
  <text x="182" y="762" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">configure</text>
  <rect x="272" y="730" width="100" height="50" rx="10" fill="#1c2a4d" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="322" y="762" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#34d399">make</text>
  <rect x="392" y="730" width="200" height="50" rx="10" fill="#1c2a4d" stroke="#60a5fa" stroke-opacity="0.55"/>
  <text x="492" y="762" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#60a5fa">make install</text>

  <!-- ================= RIGHT: Error + Fix card ================= -->
  <rect x="860" y="250" width="660" height="340" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="860" y1="298" x2="1520" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="892" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="920" cy="274" r="7" fill="#febc2e"/>
  <circle cx="948" cy="274" r="7" fill="#28c840"/>
  <text x="1190" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">terminal — error</text>

  <!-- highlighted error row -->
  <rect x="880" y="348" width="620" height="76" rx="8" fill="#f472b6" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="892" y="340" fill="#94a3b8"># 启动服务器后访问出错</text>
    <text x="892" y="382"><tspan fill="#f472b6">webp-ffi-0.1.7/ext/webp_ffi/</tspan></text>
    <text x="892" y="414"><tspan fill="#f472b6">  x86_64-linux/</tspan><tspan fill="#fbbf24" font-weight="700">libwebp_ffi.so</tspan></text>
    <text x="892" y="460" fill="#94a3b8"># 动态链接器找不到 .so</text>
    <text x="892" y="500" fill="#94a3b8"># 需要把 /usr/local/lib 加入搜索路径</text>
  </g>

  <!-- Fix card -->
  <rect x="860" y="620" width="660" height="200" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="860" y1="668" x2="1520" y2="668" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="892" cy="644" r="7" fill="#ff5f57"/>
  <circle cx="920" cy="644" r="7" fill="#febc2e"/>
  <circle cx="948" cy="644" r="7" fill="#28c840"/>
  <text x="1190" y="650" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">terminal — fix</text>

  <!-- highlighted fix row -->
  <rect x="880" y="708" width="620" height="38" rx="8" fill="#34d399" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="892" y="700" fill="#94a3b8"># 修复：注册动态库搜索路径</text>
    <text x="892" y="738"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> sudo sh -c 'echo "/usr/local/lib" \</tspan></text>
    <text x="892" y="770"><tspan fill="#cbd5e1">  > /etc/ld.so.conf.d/</tspan><tspan fill="#fbbf24">user_local.conf</tspan><tspan fill="#cbd5e1">'</tspan></text>
    <text x="892" y="802"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> sudo ldconfig</tspan></text>
  </g>

  <!-- Connector arrow -->
  <line x1="1190" y1="590" x2="1190" y2="620" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
