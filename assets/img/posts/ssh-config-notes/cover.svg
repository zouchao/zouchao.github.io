<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
    <g id="keyGlyph" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="5"/>
      <path d="M5,0 L17,0 M13,0 L13,4 M17,0 L17,4"/>
    </g>
    <g id="lockGlyph" fill="currentColor">
      <rect x="-7" y="-1" width="14" height="10" rx="2.5"/>
      <path d="M-4,-1 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">~/.ssh</text>
  <rect x="410" y="88" width="14" height="66" rx="2" fill="#34d399" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">SSH 认证 · 多账号 Git · 端口转发</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU</text>

  <!-- ================= terminal card ================= -->
  <rect x="80" y="250" width="680" height="570" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="760" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="420" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">~/.ssh — zsh</text>

  <!-- highlighted config row -->
  <rect x="100" y="368" width="640" height="38" rx="8" fill="#fbbf24" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19">
    <text x="112" y="348"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> ls -la ~/.ssh</tspan></text>
    <text x="112" y="394"><tspan fill="#5d6f92">-rw-------  </tspan><tspan fill="#fbbf24" font-weight="700">config</tspan><tspan fill="#5d6f92">          # 每个连接一份档案</tspan></text>
    <text x="112" y="434"><tspan fill="#5d6f92">-rw-------  </tspan><tspan fill="#e2e8f0">id_ed25519</tspan><tspan fill="#5d6f92">      # 个人 GitHub</tspan></text>
    <text x="112" y="474"><tspan fill="#5d6f92">-rw-------  </tspan><tspan fill="#e2e8f0">id_rsa_work</tspan><tspan fill="#5d6f92">     # 公司 GitHub</tspan></text>
    <text x="112" y="514"><tspan fill="#5d6f92">-rw-------  </tspan><tspan fill="#e2e8f0">id_rsa_aliyun</tspan><tspan fill="#5d6f92">   # 阿里云效</tspan></text>
    <text x="112" y="554"><tspan fill="#5d6f92">-rw-------  </tspan><tspan fill="#e2e8f0">known_hosts</tspan><tspan fill="#5d6f92">     # 见过的服务器指纹</tspan></text>
    <text x="112" y="626"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> ssh -T git@github.com-work</tspan></text>
    <text x="112" y="662" font-size="17"><tspan fill="#34d399">Hi work-user! You've successfully authenticated,</tspan></text>
    <text x="112" y="686" font-size="17"><tspan fill="#2f9e77">but GitHub does not provide shell access.</tspan></text>
  </g>

  <!-- chips -->
  <rect x="112" y="730" width="252" height="50" rx="10" fill="#1c2a4d" stroke="#fbbf24" stroke-opacity="0.55"/>
  <text x="238" y="762" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">IdentitiesOnly yes</text>
  <rect x="384" y="730" width="252" height="50" rx="10" fill="#1c2a4d" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="510" y="762" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#34d399">AddKeysToAgent yes</text>

  <!-- ================= connectors ================= -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 760 470 C 920 470, 900 316, 1064 316"/>
    <path d="M 760 500 C 920 500, 900 486, 1064 486"/>
    <path d="M 760 530 C 920 530, 900 656, 1064 656"/>
  </g>

  <!-- ================= host cards ================= -->
  <!-- card 1 -->
  <rect x="1080" y="260" width="440" height="112" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <use href="#keyGlyph" transform="translate(1114, 296)" color="#fbbf24"/>
  <text x="1142" y="304" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f1f5f9">github.com-work</text>
  <text x="1114" y="342" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17"><tspan fill="#fbbf24">id_rsa_work</tspan><tspan fill="#94a3b8"> → ssh.github.com</tspan><tspan fill="#60a5fa">:443</tspan></text>

  <!-- card 2 -->
  <rect x="1080" y="430" width="440" height="112" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <use href="#keyGlyph" transform="translate(1114, 466)" color="#34d399"/>
  <text x="1142" y="474" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f1f5f9">codeup.aliyun.com</text>
  <text x="1114" y="512" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17"><tspan fill="#34d399">id_rsa_aliyun</tspan><tspan fill="#94a3b8"> → 云效 Codeup</tspan></text>

  <!-- card 3 -->
  <rect x="1080" y="600" width="440" height="112" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <use href="#keyGlyph" transform="translate(1114, 636)" color="#60a5fa"/>
  <text x="1142" y="644" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f1f5f9">mygit</text>
  <text x="1114" y="682" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17"><tspan fill="#60a5fa">id_ed25519_work</tspan><tspan fill="#94a3b8"> → 100.64.0.10:2222</tspan></text>

  <!-- ================= tunnel strip ================= -->
  <rect x="840" y="744" width="680" height="76" rx="14" fill="#101a31" stroke="#27385e" stroke-width="1.5"/>
  <text x="868" y="789" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#60a5fa">localhost:13306</text>
  <line x1="1048" y1="782" x2="1288" y2="782" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <use href="#lockGlyph" transform="translate(1168, 766)" color="#34d399"/>
  <text x="1168" y="806" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#94a3b8">SSH 隧道</text>
  <text x="1308" y="789" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18"><tspan fill="#34d399">172.16.0.10:3306</tspan><tspan fill="#5d6f92"> MySQL</tspan></text>
</svg>
