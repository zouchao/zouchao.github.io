<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
    <g id="keyGlyph" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="5"/>
      <path d="M5,0 L17,0 M13,0 L13,4 M17,0 L17,4"/>
    </g>
    <g id="lockGlyph" fill="currentColor">
      <rect x="-7" y="-1" width="14" height="10" rx="2.5"/>
      <path d="M-4,-1 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">ssh-add</text>
  <rect x="464" y="88" width="14" height="66" rx="2" fill="#f472b6" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">Agent 签名失败 · 密钥错位 · ssh-add 修复</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">Agent admitted failure to sign using the key.</text>

  <!-- ================= LEFT: Error terminal card ================= -->
  <rect x="80" y="250" width="680" height="420" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="760" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="420" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">terminal — git push</text>

  <!-- highlighted error row -->
  <rect x="100" y="378" width="640" height="38" rx="8" fill="#f472b6" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19">
    <text x="112" y="348"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> git push origin master</tspan></text>
    <text x="112" y="404"><tspan fill="#f472b6">Agent admitted failure to sign</tspan></text>
    <text x="112" y="434"><tspan fill="#f472b6">  using the key.</tspan></text>
    <text x="112" y="474"><tspan fill="#fbbf24">Permission denied (publickey).</tspan></text>
    <text x="112" y="514"><tspan fill="#94a3b8">fatal: Could not read from</tspan></text>
    <text x="112" y="544"><tspan fill="#94a3b8">  remote repository.</tspan></text>
  </g>

  <!-- ================= RIGHT: Fix terminal card ================= -->
  <rect x="860" y="250" width="660" height="420" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="860" y1="298" x2="1520" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="892" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="920" cy="274" r="7" fill="#febc2e"/>
  <circle cx="948" cy="274" r="7" fill="#28c840"/>
  <text x="1190" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">terminal — fix</text>

  <!-- highlighted fix row -->
  <rect x="880" y="368" width="620" height="38" rx="8" fill="#34d399" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19">
    <text x="892" y="348"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> ssh-add</tspan></text>
    <text x="892" y="404"><tspan fill="#34d399">Identity added:</tspan></text>
    <text x="892" y="444"><tspan fill="#e2e8f0">  /home/user/.ssh/id_rsa</tspan></text>
    <text x="892" y="484"><tspan fill="#e2e8f0">  (/home/user/.ssh/id_rsa)</tspan></text>
    <text x="892" y="554"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> git push origin master</tspan></text>
    <text x="892" y="590"><tspan fill="#34d399">Everything up-to-date</tspan></text>
  </g>

  <!-- ================= Bottom: Cause explanation ================= -->
  <rect x="80" y="700" width="1440" height="120" rx="14" fill="#101a31" stroke="#27385e" stroke-width="1.5"/>

  <!-- Old key (agent side) -->
  <use href="#keyGlyph" transform="translate(140, 760)" color="#f472b6"/>
  <text x="174" y="752" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#f472b6">ssh-agent</text>
  <text x="174" y="780" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#94a3b8">持有旧密钥（~/.ssh/id_rsa 被篡改）</text>

  <!-- Arrow -->
  <line x1="520" y1="760" x2="720" y2="760" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="620" y="748" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#fbbf24">ssh-add</text>

  <!-- New key (server side) -->
  <use href="#keyGlyph" transform="translate(760, 760)" color="#34d399"/>
  <text x="794" y="752" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#34d399">ssh-agent ✓</text>
  <text x="794" y="780" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#94a3b8">重新加载正确密钥，签名通过</text>

  <!-- Server lock -->
  <use href="#lockGlyph" transform="translate(1240, 760)" color="#60a5fa"/>
  <text x="1270" y="752" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#60a5fa">github.com</text>
  <text x="1270" y="780" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#94a3b8">服务端公钥验证通过</text>

  <line x1="1120" y1="760" x2="1210" y2="760" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
