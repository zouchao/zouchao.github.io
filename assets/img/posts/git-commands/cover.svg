<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">git</text>
  <rect x="252" y="88" width="14" height="66" rx="2" fill="#34d399" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">远程仓库 · 分支 · 标签 · 子模块 · 后悔药</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">$ git remote -v</text>

  <!-- ============ Row 1: Remote + Branch ============ -->
  <!-- Remote card -->
  <rect x="80" y="260" width="460" height="270" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="112" y="304" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#34d399">远程仓库</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="112" y="346"><tspan fill="#cbd5e1">git clone</tspan><tspan fill="#5d6f92">  检出仓库</tspan></text>
    <text x="112" y="378"><tspan fill="#cbd5e1">git remote -v</tspan><tspan fill="#5d6f92">  查看远程</tspan></text>
    <text x="112" y="410"><tspan fill="#cbd5e1">git remote add</tspan><tspan fill="#5d6f92">  添加远程</tspan></text>
    <text x="112" y="442"><tspan fill="#fbbf24">git pull</tspan><tspan fill="#5d6f92">  拉取</tspan></text>
    <text x="112" y="474"><tspan fill="#fbbf24">git push</tspan><tspan fill="#5d6f92">  推送</tspan></text>
    <text x="112" y="506"><tspan fill="#60a5fa">git push origin test:master</tspan></text>
  </g>

  <!-- Branch card -->
  <rect x="580" y="260" width="460" height="270" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="612" y="304" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#60a5fa">分支 branch</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="612" y="346"><tspan fill="#cbd5e1">git branch</tspan><tspan fill="#5d6f92">  查看本地</tspan></text>
    <text x="612" y="378"><tspan fill="#cbd5e1">git branch -r</tspan><tspan fill="#5d6f92">  查看远程</tspan></text>
    <text x="612" y="410"><tspan fill="#34d399">git checkout -b</tspan><tspan fill="#5d6f92">  新建并切换</tspan></text>
    <text x="612" y="442"><tspan fill="#fbbf24">git merge</tspan><tspan fill="#5d6f92">  合并分支</tspan></text>
    <text x="612" y="474"><tspan fill="#cbd5e1">git branch -d</tspan><tspan fill="#5d6f92">  删除分支</tspan></text>
    <text x="612" y="506"><tspan fill="#60a5fa">git rebase -i HEAD~2</tspan></text>
  </g>

  <!-- Tag card -->
  <rect x="1080" y="260" width="440" height="270" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="1112" y="304" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#fbbf24">标签 tag</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="1112" y="346"><tspan fill="#cbd5e1">git tag</tspan><tspan fill="#5d6f92">  查看版本</tspan></text>
    <text x="1112" y="378"><tspan fill="#cbd5e1">git tag v1.0</tspan><tspan fill="#5d6f92">  创建</tspan></text>
    <text x="1112" y="410"><tspan fill="#34d399">git tag -a v1.0 -m 'msg'</tspan></text>
    <text x="1112" y="442"><tspan fill="#cbd5e1">git push origin --tags</tspan></text>
    <text x="1112" y="474"><tspan fill="#cbd5e1">git tag -d v1.0</tspan><tspan fill="#5d6f92">  删除</tspan></text>
  </g>

  <!-- ============ Row 2: Submodule + Undo ============ -->
  <!-- Submodule card -->
  <rect x="80" y="570" width="460" height="260" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="112" y="614" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f472b6">子模块 submodule</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="112" y="656"><tspan fill="#34d399">git submodule add</tspan><tspan fill="#5d6f92">  添加</tspan></text>
    <text x="112" y="690"><tspan fill="#cbd5e1">git submodule init</tspan><tspan fill="#5d6f92">  初始化</tspan></text>
    <text x="112" y="724"><tspan fill="#fbbf24">git submodule update</tspan><tspan fill="#5d6f92">  更新</tspan></text>
    <text x="112" y="758" fill="#5d6f92"># 删除需 4 步手动清理</text>
    <text x="112" y="792"><tspan fill="#cbd5e1">git rm --cached</tspan><tspan fill="#5d6f92"> + 删配置</tspan></text>
  </g>

  <!-- Undo card -->
  <rect x="580" y="570" width="460" height="260" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="612" y="614" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#a78bfa">后悔药</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="612" y="656"><tspan fill="#cbd5e1">git reset --hard</tspan><tspan fill="#5d6f92">  恢复上次提交</tspan></text>
    <text x="612" y="690"><tspan fill="#fbbf24">git reset HEAD^</tspan><tspan fill="#5d6f92">  回退上一版</tspan></text>
    <text x="612" y="724"><tspan fill="#cbd5e1">git reset 057d</tspan><tspan fill="#5d6f92">  回退到指定</tspan></text>
    <text x="612" y="758"><tspan fill="#34d399">git reset --hard origin/master</tspan></text>
    <text x="612" y="792"><tspan fill="#cbd5e1">git clean -f</tspan><tspan fill="#5d6f92">  清除未跟踪文件</tspan></text>
  </g>

  <!-- Multi-push card -->
  <rect x="1080" y="570" width="440" height="260" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="1112" y="614" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#34d399">一键多推</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="15">
    <text x="1112" y="656" fill="#94a3b8"># .git/config</text>
    <text x="1112" y="688" fill="#fbbf24">[remote "all"]</text>
    <text x="1112" y="718"><tspan fill="#cbd5e1">url = git@github.com:</tspan></text>
    <text x="1112" y="746"><tspan fill="#cbd5e1">      dragon/test.git</tspan></text>
    <text x="1112" y="778"><tspan fill="#cbd5e1">url = git@gitcafe.com:</tspan></text>
    <text x="1112" y="806"><tspan fill="#cbd5e1">      dragon/test.git</tspan></text>
  </g>

  <!-- bottom chip -->
  <rect x="1260" y="530" width="260" height="36" rx="10" fill="#1c2a4d" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="1390" y="554" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#34d399">$ git push all</text>
</svg>
