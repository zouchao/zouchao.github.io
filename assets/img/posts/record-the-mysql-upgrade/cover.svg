<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">mysql_upgrade</text>
  <rect x="780" y="88" width="14" height="66" rx="2" fill="#f472b6" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">MySQL 升级 · 系统表修复 · Rails ActiveRecord</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">performance_schema.session_variables</text>

  <!-- ================= error terminal ================= -->
  <rect x="80" y="250" width="900" height="280" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="980" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="530" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">rake db:migrate — ERROR</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="112" y="340"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> rake db:migrate</tspan></text>

    <rect x="100" y="358" width="860" height="38" rx="8" fill="#f472b6" opacity="0.09"/>
    <text x="112" y="384"><tspan fill="#f472b6" font-weight="700">Mysql2::Error:</tspan><tspan fill="#cbd5e1"> Table '</tspan><tspan fill="#fbbf24">performance_schema.session_variables</tspan><tspan fill="#cbd5e1">'</tspan></text>

    <rect x="100" y="400" width="860" height="38" rx="8" fill="#f472b6" opacity="0.09"/>
    <text x="112" y="426"><tspan fill="#cbd5e1">doesn't exist: </tspan><tspan fill="#60a5fa">SHOW VARIABLES LIKE 'character_set_database'</tspan></text>

    <text x="112" y="480"><tspan fill="#f472b6">rake aborted!</tspan></text>
    <text x="112" y="510" font-size="16"><tspan fill="#94a3b8">ActiveRecord::StatementInvalid: Mysql2::Error ...</tspan></text>
  </g>

  <!-- ================= fix terminal ================= -->
  <rect x="80" y="570" width="900" height="250" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="618" x2="980" y2="618" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="594" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="594" r="7" fill="#febc2e"/>
  <circle cx="168" cy="594" r="7" fill="#28c840"/>
  <text x="530" y="600" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">fix — zsh</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19">
    <text x="112" y="660"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> mysql_upgrade -u </tspan><tspan fill="#fbbf24">用户名</tspan><tspan fill="#cbd5e1"> -p </tspan><tspan fill="#f472b6" font-weight="700">--force</tspan></text>

    <rect x="100" y="684" width="860" height="38" rx="8" fill="#34d399" opacity="0.09"/>
    <text x="112" y="710"><tspan fill="#94a3b8"># 升级系统表，重建 performance_schema</tspan></text>

    <text x="112" y="760"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> </tspan><tspan fill="#60a5fa" font-weight="700">重启 MySQL 服务</tspan></text>
    <text x="112" y="796" font-size="17"><tspan fill="#34d399">✓  db:migrate 恢复正常</tspan></text>
  </g>

  <!-- ================= right: cause card ================= -->
  <rect x="1060" y="270" width="460" height="550" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="1100" y="320" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f1f5f9">Root Cause</text>

  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="18">
    <text x="1100" y="370" fill="#94a3b8">MySQL 升级后数据文件共用</text>
    <text x="1100" y="400" fill="#94a3b8">但系统表结构未同步更新</text>
  </g>

  <!-- arrow down inside card -->
  <path d="M 1290 420 C 1290 450, 1290 450, 1290 470" fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- DB cylinder representation -->
  <ellipse cx="1290" cy="510" rx="80" ry="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <rect x="1210" y="510" width="160" height="80" fill="#131d35" stroke="none"/>
  <line x1="1210" y1="510" x2="1210" y2="590" stroke="#fbbf24" stroke-width="2"/>
  <line x1="1370" y1="510" x2="1370" y2="590" stroke="#fbbf24" stroke-width="2"/>
  <ellipse cx="1290" cy="590" rx="80" ry="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="1290" y="556" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#fbbf24">performance_schema</text>

  <!-- missing table indicator -->
  <line x1="1220" y1="625" x2="1360" y2="625" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="1290" y="656" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#f472b6">session_variables ✗</text>

  <!-- arrow to fix -->
  <path d="M 1290 680 C 1290 710, 1290 710, 1290 730" fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- fix chip -->
  <rect x="1140" y="740" width="300" height="50" rx="10" fill="#1c2a4d" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="1290" y="772" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#34d399">mysql_upgrade --force</text>
</svg>