<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">_config.yml</text>
  <rect x="680" y="88" width="14" height="66" rx="2" fill="#fbbf24" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">博客翻新 · 标签整理 · Chirpy · GitHub Actions · giscus</text>

  <!-- watermark -->
  <text x="1520" y="210" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">gem-based theme</text>

  <!-- ============= terminal card: permalink preserved ============= -->
  <rect x="80" y="250" width="680" height="480" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="760" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="420" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">_config.yml</text>

  <!-- highlight bar on permalink line -->
  <rect x="100" y="398" width="640" height="38" rx="8" fill="#fbbf24" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19">
    <text x="112" y="340" fill="#5d6f92"># 十几年外链不能断</text>
    <text x="112" y="378" fill="#a78bfa">defaults:</text>
    <text x="132" y="414"><tspan fill="#94a3b8">- scope:</tspan></text>
    <text x="152" y="450"><tspan fill="#94a3b8">path: </tspan><tspan fill="#fbbf24">""</tspan></text>
    <text x="152" y="486"><tspan fill="#94a3b8">type: </tspan><tspan fill="#fbbf24">posts</tspan></text>
    <text x="132" y="522"><tspan fill="#94a3b8">values:</tspan></text>
    <text x="152" y="558"><tspan fill="#94a3b8">permalink: </tspan><tspan fill="#34d399">/:year/:month/:day/:title</tspan></text>
    <text x="112" y="620" fill="#5d6f92"># timezone 必须和 date 一起钉</text>
    <text x="112" y="658"><tspan fill="#94a3b8">timezone: </tspan><tspan fill="#fbbf24">Asia/Shanghai</tspan></text>
    <text x="112" y="696"><tspan fill="#5d6f92"># date: 2026-08-26 16:30:00 +0800</tspan></text>
  </g>

  <!-- ============= connectors ============= -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 760 360 C 870 360, 870 300, 984 300"/>
    <path d="M 760 420 C 870 420, 870 400, 984 400"/>
    <path d="M 760 480 C 870 480, 870 500, 984 500"/>
    <path d="M 760 560 C 870 560, 870 620, 984 620"/>
    <path d="M 760 620 C 870 620, 870 720, 984 720"/>
  </g>

  <!-- ============= five change cards ============= -->
  <!-- card 1: tags -->
  <rect x="1000" y="250" width="520" height="96" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="1036" y="292" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#fbbf24">标签整理</text>
  <text x="1036" y="324" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#94a3b8">40 个主题标签 · 8 分类 · 官方大小写</text>

  <!-- card 2: Chirpy -->
  <rect x="1000" y="356" width="520" height="96" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="1036" y="398" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#34d399">Chirpy</text>
  <text x="1036" y="430" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#94a3b8">gem 安装 · 目录 · 搜索 · 深色模式</text>

  <!-- card 3: GitHub Actions -->
  <rect x="1000" y="462" width="520" height="96" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="1036" y="504" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#60a5fa">GitHub Actions</text>
  <text x="1036" y="536" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16"><tspan fill="#94a3b8">ruby 3.4 · </tspan><tspan fill="#cbd5e1">bundle exec jekyll b</tspan></text>

  <!-- card 4: giscus -->
  <rect x="1000" y="568" width="520" height="96" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="1036" y="610" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#a78bfa">giscus</text>
  <text x="1036" y="642" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#94a3b8">GitHub Discussions · 无广告 · 不追踪</text>

  <!-- card 5: analytics -->
  <rect x="1000" y="674" width="520" height="96" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="1036" y="716" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#f472b6">GA4 + GoatCounter</text>
  <text x="1036" y="748" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#94a3b8">报表 + 阅读量 · 无 cookie 展示</text>

  <!-- ============= bottom pitfall strip ============= -->
  <rect x="80" y="790" width="680" height="64" rx="12" fill="#101a31" stroke="#f472b6" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="112" y="828" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16"><tspan fill="#f472b6">坑: </tspan><tspan fill="#94a3b8">部署源必须切 </tspan><tspan fill="#60a5fa">GitHub Actions</tspan><tspan fill="#94a3b8">，别留分支构建打架</tspan></text>

  <rect x="780" y="790" width="740" height="64" rx="12" fill="#101a31" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="812" y="828" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16"><tspan fill="#fbbf24">坑: </tspan><tspan fill="#94a3b8">裸日期按 UTC 解析 → 全部钉 </tspan><tspan fill="#fbbf24">+0800</tspan><tspan fill="#94a3b8"> 防 URL 跨天</tspan></text>
</svg>
