<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
    <g id="keyGlyph" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="5"/>
      <path d="M5,0 L17,0 M13,0 L13,4 M17,0 L17,4"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">.gitconfig</text>
  <rect x="622" y="88" width="14" height="66" rx="2" fill="#a78bfa" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">多身份 Git · includeIf hasconfig · 按远程地址自动切换</text>

  <!-- watermark -->
  <text x="1520" y="210" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">hasconfig:remote.*.url:</text>

  <!-- ============= .gitconfig terminal card ============= -->
  <rect x="80" y="250" width="680" height="520" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="760" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="420" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">~/.gitconfig</text>

  <!-- highlight bars on includeIf lines -->
  <rect x="100" y="538" width="640" height="38" rx="8" fill="#fbbf24" opacity="0.09"/>
  <rect x="100" y="596" width="640" height="38" rx="8" fill="#34d399" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="112" y="340"><tspan fill="#a78bfa">[user]</tspan></text>
    <text x="132" y="376"><tspan fill="#94a3b8">name = </tspan><tspan fill="#f1f5f9">Your Name</tspan></text>
    <text x="132" y="412"><tspan fill="#94a3b8">email = </tspan><tspan fill="#60a5fa">you@personal.dev</tspan></text>
    <text x="112" y="460"><tspan fill="#a78bfa">[pull]</tspan></text>
    <text x="132" y="496"><tspan fill="#94a3b8">rebase = </tspan><tspan fill="#fbbf24">true</tspan></text>
    <text x="112" y="558" font-size="17"><tspan fill="#fbbf24">[includeIf "hasconfig:</tspan></text>
    <text x="132" y="588" font-size="17"><tspan fill="#fbbf24">  remote.*.url:git@github-work:*/**"</tspan><tspan fill="#a78bfa">]</tspan></text>
    <text x="132" y="624"><tspan fill="#94a3b8">path = </tspan><tspan fill="#fbbf24">~/.gitconfig-work</tspan></text>
    <text x="112" y="672" font-size="17"><tspan fill="#34d399">[includeIf "hasconfig:</tspan></text>
    <text x="132" y="702" font-size="17"><tspan fill="#34d399">  remote.*.url:ssh://git@github-work/**"</tspan><tspan fill="#a78bfa">]</tspan></text>
    <text x="132" y="738"><tspan fill="#94a3b8">path = </tspan><tspan fill="#34d399">~/.gitconfig-work</tspan></text>
  </g>

  <!-- ============= connectors ============= -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <!-- scp form → work card -->
    <path d="M 760 570 C 880 570, 880 390, 984 390"/>
    <!-- ssh:// form → work card -->
    <path d="M 760 680 C 880 680, 880 430, 984 430"/>
    <!-- global → personal card -->
    <path d="M 760 380 C 880 380, 880 610, 984 610"/>
  </g>

  <!-- ============= work identity card ============= -->
  <rect x="1000" y="260" width="520" height="280" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <use href="#keyGlyph" transform="translate(1034, 296)" color="#fbbf24"/>
  <text x="1062" y="304" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#fbbf24">~/.gitconfig-work</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="1036" y="348"><tspan fill="#a78bfa">[user]</tspan></text>
    <text x="1056" y="384"><tspan fill="#94a3b8">name = </tspan><tspan fill="#f1f5f9">Your Work Name</tspan></text>
    <text x="1056" y="420"><tspan fill="#94a3b8">email = </tspan><tspan fill="#fbbf24">name@company.com</tspan></text>
  </g>
  <!-- ssh config sub-card -->
  <line x1="1000" y1="448" x2="1520" y2="448" stroke="#27385e" stroke-width="1" stroke-dasharray="4 4"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="16">
    <text x="1036" y="478" fill="#5d6f92"># ~/.ssh/config</text>
    <text x="1036" y="508"><tspan fill="#60a5fa">Host</tspan><tspan fill="#f1f5f9"> github-work</tspan></text>
    <text x="1056" y="534"><tspan fill="#94a3b8">HostName </tspan><tspan fill="#34d399">ssh.github.com</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#60a5fa">443</tspan></text>
  </g>

  <!-- ============= personal identity card ============= -->
  <rect x="1000" y="570" width="520" height="140" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <use href="#keyGlyph" transform="translate(1034, 606)" color="#60a5fa"/>
  <text x="1062" y="614" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#60a5fa">global (个人)</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="1036" y="658"><tspan fill="#94a3b8">email = </tspan><tspan fill="#60a5fa">you@personal.dev</tspan></text>
    <text x="1036" y="692"><tspan fill="#94a3b8">Host </tspan><tspan fill="#34d399">github.com</tspan></text>
  </g>

  <!-- ============= bottom chip: glob gotcha ============= -->
  <rect x="80" y="800" width="460" height="50" rx="10" fill="#1c2a4d" stroke="#f472b6" stroke-opacity="0.55"/>
  <text x="310" y="832" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17"><tspan fill="#f472b6">* </tspan><tspan fill="#94a3b8">不跨 </tspan><tspan fill="#f472b6">/</tspan><tspan fill="#94a3b8"> → 用 </tspan><tspan fill="#fbbf24">*/**</tspan><tspan fill="#94a3b8"> 或 </tspan><tspan fill="#fbbf24">/**</tspan></text>

  <rect x="560" y="800" width="500" height="50" rx="10" fill="#1c2a4d" stroke="#a78bfa" stroke-opacity="0.55"/>
  <text x="810" y="832" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17"><tspan fill="#a78bfa">git config</tspan><tspan fill="#94a3b8"> 不评估 hasconfig → 用真实 commit 验</tspan></text>
</svg>
