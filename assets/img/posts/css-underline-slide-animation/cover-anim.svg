<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .grow, .shrink { transform-box: fill-box; animation: 6s ease infinite; }
    .grow { transform-origin: left center; animation-name: grow; }
    .shrink { transform-origin: right center; animation-name: shrink; }
    .grow-head { animation: grow-head 6s ease infinite; }
    .shrink-head { animation: shrink-head 6s ease infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes grow {
      0%, 8% { transform: scaleX(0); opacity: 1; }
      38%, 88% { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(1); opacity: 0; }
    }
    @keyframes grow-head {
      0%, 8% { transform: translateX(0); opacity: 1; }
      38% { transform: translateX(476px); opacity: 0; }
      100% { transform: translateX(476px); opacity: 0; }
    }
    @keyframes shrink {
      0%, 46% { transform: scaleX(1); opacity: 1; }
      76%, 92% { transform: scaleX(0); opacity: 1; }
      93% { transform: scaleX(1); opacity: 0; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes shrink-head {
      0%, 46% { transform: translateX(0); opacity: 1; }
      76% { transform: translateX(476px); opacity: 0; }
      92% { transform: translateX(476px); opacity: 0; }
      93% { transform: translateX(0); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .grow, .shrink, .grow-head, .shrink-head { animation: none; }
      .grow { transform: scaleX(0.63); }
      .grow-head { transform: translateX(300px); }
      .shrink { transform: scaleX(0.56); }
      .shrink-head { transform: translateX(208px); }
    }
  </style>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">a:hover</text>
  <g opacity="0.9"><rect class="cursor" x="464" y="88" width="14" height="66" rx="2" fill="#34d399"/></g>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">纯 CSS 下划线 · size 控制长度 · position 控制方向</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">transition: background-size 0.8s ease</text>

  <!-- ================= code card ================= -->
  <rect x="80" y="250" width="680" height="570" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="760" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="420" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">underline.css</text>

  <!-- highlighted position rows -->
  <rect x="100" y="408" width="640" height="38" rx="8" fill="#fbbf24" opacity="0.09"/>
  <rect x="100" y="608" width="640" height="38" rx="8" fill="#fbbf24" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19">
    <text x="112" y="348"><tspan fill="#34d399">a</tspan><tspan fill="#cbd5e1"> {</tspan></text>
    <text x="135" y="388"><tspan fill="#60a5fa">background-size</tspan><tspan fill="#cbd5e1">: 0% 1px;</tspan></text>
    <text x="135" y="434"><tspan fill="#60a5fa">background-position</tspan><tspan fill="#cbd5e1">: </tspan><tspan fill="#fbbf24" font-weight="700">right</tspan><tspan fill="#cbd5e1"> bottom;</tspan></text>
    <text x="135" y="474"><tspan fill="#60a5fa">transition</tspan><tspan fill="#cbd5e1">: background-size 0.8s ease;</tspan></text>
    <text x="112" y="514"><tspan fill="#cbd5e1">}</tspan></text>
    <text x="112" y="554"><tspan fill="#34d399">a:hover</tspan><tspan fill="#cbd5e1"> {</tspan></text>
    <text x="135" y="594"><tspan fill="#60a5fa">background-size</tspan><tspan fill="#cbd5e1">: 100% 1px;</tspan></text>
    <text x="135" y="634"><tspan fill="#60a5fa">background-position</tspan><tspan fill="#cbd5e1">: </tspan><tspan fill="#fbbf24" font-weight="700">left</tspan><tspan fill="#cbd5e1"> bottom;</tspan></text>
    <text x="112" y="674"><tspan fill="#cbd5e1">}</tspan></text>
  </g>

  <!-- chip -->
  <rect x="112" y="730" width="540" height="50" rx="10" fill="#1c2a4d" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="382" y="762" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#34d399">linear-gradient(currentColor, currentColor)</text>

  <!-- ================= state cards ================= -->
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <!-- 1 default -->
    <rect x="840" y="250" width="680" height="160" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
    <text x="872" y="292" font-size="24" font-weight="700" fill="#f1f5f9">① 默认</text>
    <text x="1488" y="292" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8"><tspan fill="#fbbf24">0%</tspan> · right bottom</text>
    <text x="872" y="346" font-size="28" fill="#e2e8f0">纯 CSS 实现文字下划线滑入滑出动画</text>
    <line x1="872" y1="362" x2="1348" y2="362" stroke="#27385e" stroke-width="3" stroke-dasharray="6 6"/>
    <circle cx="1348" cy="362" r="6" fill="#fbbf24"/>
    <text x="1348" y="392" text-anchor="end" font-size="15" fill="#94a3b8">锚点在右 · 无下划线</text>

    <!-- 2 hover in -->
    <rect x="840" y="440" width="680" height="160" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
    <text x="872" y="482" font-size="24" font-weight="700" fill="#f1f5f9">② 移入</text>
    <text x="1488" y="482" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">→ <tspan fill="#34d399">100%</tspan> · left bottom</text>
    <text x="872" y="536" font-size="28" fill="#e2e8f0">纯 CSS 实现文字下划线滑入滑出动画</text>
    <line x1="872" y1="552" x2="1348" y2="552" stroke="#27385e" stroke-width="3" stroke-dasharray="6 6"/>
    <rect class="grow" x="872" y="550" width="476" height="4" rx="2" fill="#34d399"/>
    <path class="grow-head" d="M876,544 L890,552 L876,560 z" fill="#34d399"/>
    <circle cx="872" cy="552" r="6" fill="#34d399"/>
    <text x="872" y="582" font-size="15" fill="#94a3b8">锚点切到左 · 从左向右生长</text>

    <!-- 3 hover out -->
    <rect x="840" y="630" width="680" height="160" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
    <text x="872" y="672" font-size="24" font-weight="700" fill="#f1f5f9">③ 移出</text>
    <text x="1488" y="672" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">→ <tspan fill="#f472b6">0%</tspan> · right bottom</text>
    <text x="872" y="726" font-size="28" fill="#e2e8f0">纯 CSS 实现文字下划线滑入滑出动画</text>
    <line x1="872" y1="742" x2="1348" y2="742" stroke="#27385e" stroke-width="3" stroke-dasharray="6 6"/>
    <rect class="shrink" x="872" y="740" width="476" height="4" rx="2" fill="#f472b6"/>
    <path class="shrink-head" d="M854,734 L868,742 L854,750 z" fill="#f472b6"/>
    <circle cx="1348" cy="742" r="6" fill="#f472b6"/>
    <text x="1348" y="772" text-anchor="end" font-size="15" fill="#94a3b8">锚点切回右 · 向右收缩消失</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 1440 412 L 1440 436"/>
    <path d="M 1440 602 L 1440 626"/>
  </g>
</svg>
