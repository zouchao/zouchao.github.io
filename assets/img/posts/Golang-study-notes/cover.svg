<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">go build</text>
  <rect x="516" y="88" width="14" height="66" rx="2" fill="#60a5fa" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">变量与常量 · 基础类型 · 切片与映射</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">iota · rune · byte · uintptr</text>

  <!-- ================= left terminal card ================= -->
  <rect x="80" y="250" width="680" height="570" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="760" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="420" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">main.go — Go 基础</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19">
    <text x="112" y="340"><tspan fill="#60a5fa" font-weight="700">const</tspan><tspan fill="#cbd5e1"> (</tspan></text>
    <text x="112" y="376"><tspan fill="#cbd5e1">    a = </tspan><tspan fill="#fbbf24" font-weight="700">iota</tspan><tspan fill="#5d6f92">  // a=0</tspan></text>
    <text x="112" y="412"><tspan fill="#cbd5e1">    b = </tspan><tspan fill="#a78bfa">"B"</tspan></text>
    <text x="112" y="448"><tspan fill="#cbd5e1">    c = </tspan><tspan fill="#fbbf24" font-weight="700">iota</tspan><tspan fill="#5d6f92">  // c=2</tspan></text>
    <text x="112" y="484"><tspan fill="#cbd5e1">)</tspan></text>

    <!-- highlight bar -->
    <rect x="100" y="514" width="640" height="38" rx="8" fill="#fbbf24" opacity="0.09"/>

    <text x="112" y="540"><tspan fill="#60a5fa" font-weight="700">var</tspan><tspan fill="#cbd5e1"> s </tspan><tspan fill="#60a5fa">string</tspan><tspan fill="#cbd5e1"> = </tspan><tspan fill="#a78bfa">"hello"</tspan></text>
    <text x="112" y="576"><tspan fill="#5d6f92">// s[0] = 'c'  ← 字符串不可变</tspan></text>
    <text x="112" y="612"><tspan fill="#cbd5e1">c := </tspan><tspan fill="#34d399">[]byte</tspan><tspan fill="#cbd5e1">(s)</tspan></text>
    <text x="112" y="648"><tspan fill="#cbd5e1">c[0] = </tspan><tspan fill="#a78bfa">'c'</tspan><tspan fill="#5d6f92">  // 转 []byte 再改</tspan></text>
  </g>

  <!-- chips bottom-left -->
  <rect x="112" y="700" width="180" height="50" rx="10" fill="#1c2a4d" stroke="#60a5fa" stroke-opacity="0.55"/>
  <text x="202" y="732" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#60a5fa">make()</text>
  <rect x="312" y="700" width="180" height="50" rx="10" fill="#1c2a4d" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="402" y="732" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#34d399">new()</text>
  <rect x="512" y="700" width="228" height="50" rx="10" fill="#1c2a4d" stroke="#fbbf24" stroke-opacity="0.55"/>
  <text x="626" y="732" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">thread-safe</text>

  <!-- ================= right side: type cards ================= -->
  <!-- card 1: slice -->
  <rect x="840" y="260" width="680" height="140" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="880" y="310" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f1f5f9">Slice</text>
  <text x="980" y="310" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" fill="#94a3b8">切片 — 底层数组的视图</text>
  <text x="880" y="358" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18"><tspan fill="#34d399">ar[2:5]</tspan><tspan fill="#94a3b8">  长度 = j - i</tspan></text>

  <!-- card 2: types -->
  <rect x="840" y="430" width="680" height="140" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="880" y="480" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f1f5f9">Types</text>
  <text x="988" y="480" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" fill="#94a3b8">基础类型不可混用</text>
  <text x="880" y="528" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18"><tspan fill="#fbbf24">rune</tspan><tspan fill="#5d6f92"> = int32   </tspan><tspan fill="#60a5fa">byte</tspan><tspan fill="#5d6f92"> = uint8</tspan></text>

  <!-- card 3: map -->
  <rect x="840" y="600" width="680" height="140" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="880" y="650" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f1f5f9">Map</text>
  <text x="960" y="650" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" fill="#94a3b8">非线程安全，多协程需加锁</text>
  <text x="880" y="698" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18"><tspan fill="#f472b6">mutex lock</tspan><tspan fill="#5d6f92">  多 goroutine 存取时必须</tspan></text>

  <!-- connector arrows -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 760 400 C 800 400, 810 330, 840 330"/>
    <path d="M 760 550 C 800 550, 810 500, 840 500"/>
    <path d="M 760 700 C 800 700, 810 670, 840 670"/>
  </g>

  <!-- footer chip -->
  <rect x="840" y="780" width="680" height="50" rx="10" fill="#101a31" stroke="#27385e" stroke-width="1.5"/>
  <text x="1180" y="812" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">make → 内建类型零值初始化  ·  new → 返回指针</text>
</svg>