<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">store.apple.com</text>
  <rect x="886" y="88" width="14" height="66" rx="2" fill="#fbbf24" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">URL 后缀 · 免息分期 · 教育优惠</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">MacBook Pro 13-inch Retina</text>

  <!-- URL pattern cards -->
  <rect x="80" y="250" width="720" height="570" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="800" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="440" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">URL 后缀对照表</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="112" y="340"><tspan fill="#5d6f92">/cn</tspan><tspan fill="#94a3b8">          默认进入，无免息</tspan></text>

    <rect x="100" y="368" width="680" height="38" rx="8" fill="#fbbf24" opacity="0.09"/>
    <text x="112" y="394"><tspan fill="#fbbf24" font-weight="700">/cn_cmb</tspan><tspan fill="#94a3b8">      招商银行 12 期免息</tspan></text>

    <text x="112" y="440"><tspan fill="#34d399" font-weight="700">/cn_cmb_edu</tspan><tspan fill="#94a3b8">  招行 + 教育优惠 + 12 期免息</tspan></text>

    <rect x="100" y="468" width="680" height="38" rx="8" fill="#fbbf24" opacity="0.09"/>
    <text x="112" y="494"><tspan fill="#fbbf24" font-weight="700">/cn_icbc</tspan><tspan fill="#94a3b8">     工商银行 12 期免息</tspan></text>

    <text x="112" y="540"><tspan fill="#34d399" font-weight="700">/cn_icbc_edu</tspan><tspan fill="#94a3b8"> 工行 + 教育优惠 + 12 期免息</tspan></text>

    <text x="112" y="590"><tspan fill="#5d6f92">/cn-k12</tspan><tspan fill="#94a3b8">      教育优惠，不免息</tspan></text>
  </g>

  <!-- separator -->
  <line x1="112" y1="620" x2="768" y2="620" stroke="#27385e" stroke-width="1"/>

  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#94a3b8">
    <text x="112" y="660">完整链接格式：</text>
  </g>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="112" y="694"><tspan fill="#60a5fa">http://store.apple.com/</tspan><tspan fill="#fbbf24" font-weight="700">{suffix}</tspan><tspan fill="#94a3b8">/buy-mac/macbook-pro</tspan></text>
  </g>

  <!-- chips bottom -->
  <rect x="112" y="730" width="200" height="50" rx="10" fill="#1c2a4d" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="212" y="762" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#34d399">12 期免息</text>
  <rect x="332" y="730" width="200" height="50" rx="10" fill="#1c2a4d" stroke="#a78bfa" stroke-opacity="0.55"/>
  <text x="432" y="762" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#a78bfa">教育优惠</text>

  <!-- right side cards -->
  <rect x="840" y="250" width="680" height="180" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">
    <text x="872" y="300"> 选购建议</text>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#94a3b8">
    <text x="872" y="340">13-inch：轻便、Force Touch 触控板、性价比高</text>
    <text x="872" y="372">15-inch：独立显卡，适合游戏/图形渲染</text>
    <text x="872" y="404">参考 buyersguide.macrumors.com 判断购买时机</text>
  </g>

  <rect x="840" y="460" width="680" height="180" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">
    <text x="872" y="510"> 免息原理</text>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#94a3b8">
    <text x="872" y="550">苹果与银行签约，URL 中带银行代码后缀</text>
    <text x="872" y="582">cmb = 招商银行  icbc = 工商银行</text>
    <text x="872" y="614">edu = 叠加教育优惠价格</text>
  </g>

  <!-- buyersguide card -->
  <rect x="840" y="670" width="680" height="150" rx="14" fill="#101a31" stroke="#27385e" stroke-width="1.5"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#60a5fa">
    <text x="872" y="720">buyersguide.macrumors.com</text>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#94a3b8">
    <text x="872" y="760">根据产品发布周期给出购买建议</text>
    <text x="872" y="792">判断当前是否是入手最佳时机</text>
  </g>

  <!-- connector -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 800 500 C 820 500, 820 340, 840 340"/>
    <path d="M 800 700 C 820 700, 820 745, 840 745"/>
  </g>
</svg>
