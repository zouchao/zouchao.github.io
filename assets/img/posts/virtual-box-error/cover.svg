<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">VirtualBox</text>
  <rect x="618" y="88" width="14" height="66" rx="2" fill="#f472b6" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8"> saved state invalid ·  清除保存状态 · 一键恢复</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">VBOX_E_FILE_ERROR (0x80BB0004)</text>

  <!-- error terminal card -->
  <rect x="80" y="250" width="760" height="340" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="840" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="460" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">VirtualBox — 错误</text>

  <rect x="100" y="320" width="720" height="38" rx="8" fill="#f472b6" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="112" y="346"><tspan fill="#f472b6" font-weight="700">不能为虚拟电脑 Centos 打开一个新任务</tspan></text>
    <text x="112" y="390"><tspan fill="#94a3b8">VM cannot start because the saved state file</tspan></text>
    <text x="112" y="420"><tspan fill="#fbbf24">Snapshots/2015-06-03T02-43-10...Z.sav</tspan></text>
    <text x="112" y="450"><tspan fill="#94a3b8">is invalid (</tspan><tspan fill="#f472b6">VERR_FILE_NOT_FOUND</tspan><tspan fill="#94a3b8">)</tspan></text>
    <text x="112" y="490"><tspan fill="#94a3b8">Delete the saved state prior to starting the VM.</tspan></text>
    <text x="112" y="540"><tspan fill="#5d6f92">组件: IConsole {db7ab4ca-2a3f-4183-9243-...}</tspan></text>
  </g>

  <!-- solution card -->
  <rect x="80" y="620" width="760" height="200" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="668" x2="840" y2="668" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="644" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="644" r="7" fill="#febc2e"/>
  <circle cx="168" cy="644" r="7" fill="#28c840"/>
  <text x="460" y="650" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">解决 — Oracle VM VirtualBox 管理器</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19">
    <text x="112" y="710"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> 主界面 → 控制 → </tspan><tspan fill="#34d399" font-weight="700">清除保存的状态 (I)</tspan></text>
    <text x="112" y="756"><tspan fill="#94a3b8"># 删除损坏的 .sav 快照，虚拟机即可正常启动</tspan></text>
    <text x="112" y="792"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> VBoxManage discardstate "Centos"</tspan></text>
  </g>

  <!-- right side: cause cards -->
  <rect x="880" y="250" width="640" height="150" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">
    <text x="912" y="300"> 原因</text>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#94a3b8">
    <text x="912" y="340">保存状态的 .sav 文件丢失或被外部删除</text>
    <text x="912" y="372">VirtualBox 拒绝启动，要求先丢弃状态</text>
  </g>

  <rect x="880" y="430" width="640" height="150" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">
    <text x="912" y="480"> 影响范围</text>
  </g>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="912" y="520"><tspan fill="#fbbf24">F:\VirtualBox VMs\Centos\Snapshots\</tspan></text>
    <text x="912" y="552"><tspan fill="#94a3b8">仅影响单台虚拟机的快照，磁盘数据完好</tspan></text>
  </g>

  <!-- chips -->
  <rect x="880" y="620" width="260" height="56" rx="10" fill="#1c2a4d" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="1010" y="655" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#34d399">discardstate</text>

  <rect x="1160" y="620" width="360" height="56" rx="10" fill="#1c2a4d" stroke="#fbbf24" stroke-opacity="0.55"/>
  <text x="1340" y="655" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">定期备份 Snapshots 目录</text>

  <!-- connector -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 840 440 C 860 440, 860 325, 880 325"/>
    <path d="M 840 720 C 860 720, 860 648, 880 648"/>
  </g>
</svg>
