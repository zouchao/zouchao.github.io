<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">networksetup</text>
  <rect x="728" y="88" width="14" height="66" rx="2" fill="#60a5fa" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">本地虚拟机 OpenClash · Mac 全局代理 · Raycast 一键切换</text>

  <!-- watermark -->
  <text x="1520" y="210" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">407 Proxy Authentication Required</text>

  <!-- ============= Mac terminal card ============= -->
  <rect x="80" y="250" width="680" height="520" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="760" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="420" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">Mac — toggle-proxy.sh</text>

  <!-- highlight bars -->
  <rect x="100" y="370" width="640" height="38" rx="8" fill="#60a5fa" opacity="0.09"/>
  <rect x="100" y="630" width="640" height="38" rx="8" fill="#34d399" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="112" y="345"><tspan fill="#5d6f92"># 系统代理三件套</tspan></text>
    <text x="112" y="392"><tspan fill="#60a5fa">networksetup</tspan><tspan fill="#cbd5e1"> -setwebproxy "$svc" \</tspan></text>
    <text x="132" y="422"><tspan fill="#fbbf24">$VM_IP</tspan><tspan fill="#cbd5e1"> </tspan><tspan fill="#60a5fa">7890</tspan><tspan fill="#cbd5e1"> off</tspan></text>
    <text x="112" y="472"><tspan fill="#60a5fa">networksetup</tspan><tspan fill="#cbd5e1"> -setsecurewebproxy …</tspan></text>
    <text x="112" y="512"><tspan fill="#60a5fa">networksetup</tspan><tspan fill="#cbd5e1"> -setsocksfirewallproxy …</tspan></text>
    <text x="112" y="560"><tspan fill="#5d6f92"># bypass 内网直连</tspan></text>
    <text x="112" y="595"><tspan fill="#94a3b8">bypass: </tspan><tspan fill="#fbbf24">localhost *.local 10.* 192.168.*</tspan></text>
    <text x="112" y="648"><tspan fill="#5d6f92"># 终端 env 同步</tspan></text>
    <text x="112" y="686"><tspan fill="#34d399">export</tspan><tspan fill="#cbd5e1"> http_proxy=</tspan><tspan fill="#fbbf24">http://$VM_IP:7890</tspan></text>
  </g>

  <!-- ============= connectors ============= -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 760 390 C 880 390, 880 340, 984 340"/>
    <path d="M 760 470 C 880 470, 880 460, 984 460"/>
    <path d="M 760 550 C 880 550, 880 580, 984 580"/>
  </g>

  <!-- flow labels -->
  <text x="870" y="376" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#60a5fa">HTTP :7890</text>
  <text x="870" y="450" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#34d399">SOCKS :7891</text>
  <text x="870" y="568" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#fbbf24">PAC URL</text>

  <!-- ============= VM / OpenClash card ============= -->
  <rect x="1000" y="270" width="520" height="380" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="1000" y1="318" x2="1520" y2="318" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="1032" cy="294" r="7" fill="#ff5f57"/>
  <circle cx="1060" cy="294" r="7" fill="#febc2e"/>
  <circle cx="1088" cy="294" r="7" fill="#28c840"/>
  <text x="1260" y="300" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">UTM 虚拟机</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace">
    <text x="1036" y="362" font-size="24" font-weight="700" fill="#fbbf24">iStoreOS + OpenClash</text>
    <text x="1036" y="400" font-size="17"><tspan fill="#94a3b8">LAN: DHCP · 关闭 DHCP 服务器</tspan></text>

    <text x="1036" y="448" font-size="17"><tspan fill="#60a5fa">HTTP  :7890</tspan><tspan fill="#94a3b8">  ← 系统代理</tspan></text>
    <text x="1036" y="486" font-size="17"><tspan fill="#34d399">SOCKS :7891</tspan><tspan fill="#94a3b8">  ← 终端 env</tspan></text>
    <text x="1036" y="524" font-size="17"><tspan fill="#fbbf24">PAC   :9090</tspan><tspan fill="#94a3b8">  ← 规则分流</tspan></text>

    <!-- highlight: the auth pitfall -->
    <rect x="1016" y="552" width="488" height="38" rx="8" fill="#f472b6" opacity="0.09"/>
    <text x="1036" y="578" font-size="17"><tspan fill="#f472b6">代理认证: 留空</tspan><tspan fill="#5d6f92"> (开了 → 407)</tspan></text>

    <text x="1036" y="624" font-size="17"><tspan fill="#34d399">允许局域网连接: 开启</tspan></text>
  </g>

  <!-- ============= Raycast strip ============= -->
  <rect x="80" y="800" width="1440" height="64" rx="14" fill="#101a31" stroke="#27385e" stroke-width="1.5"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="120" y="840"><tspan fill="#a78bfa">Raycast</tspan><tspan fill="#94a3b8"> ⌘  Toggle Proxy  ·  Toggle PAC Mode  ·  Proxy Status  ·  Chrome with Proxy</tspan></text>
  </g>

  <!-- chip: chrome-proxy workaround -->
  <rect x="1000" y="700" width="520" height="50" rx="10" fill="#1c2a4d" stroke="#f472b6" stroke-opacity="0.55"/>
  <text x="1260" y="732" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17"><tspan fill="#f472b6">--proxy-server</tspan><tspan fill="#94a3b8"> VPN 下的 Chrome 逃生口</tspan></text>
</svg>
