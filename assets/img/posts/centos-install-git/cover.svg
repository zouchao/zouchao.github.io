<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">git</text>
  <rect x="252" y="88" width="14" height="66" rx="2" fill="#f472b6" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">CentOS · 源码编译 · 从依赖到安装</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">git-1.8.1.6.tar.gz</text>

  <!-- ============ terminal card ============ -->
  <rect x="80" y="260" width="740" height="580" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="308" x2="820" y2="308" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="284" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="284" r="7" fill="#febc2e"/>
  <circle cx="168" cy="284" r="7" fill="#28c840"/>
  <text x="450" y="290" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">CentOS — source install</text>

  <!-- Step 1 label -->
  <rect x="100" y="328" width="700" height="32" rx="6" fill="#fbbf24" opacity="0.09"/>
  <text x="112" y="350" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#fbbf24">① 安装依赖</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="112" y="388"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> yum install gcc curl-devel \</tspan></text>
    <text x="128" y="416"><tspan fill="#cbd5e1">zlib-devel openssl-devel \</tspan></text>
    <text x="128" y="444"><tspan fill="#cbd5e1">perl-devel expat-devel</tspan></text>
  </g>

  <!-- Step 2 label -->
  <rect x="100" y="472" width="700" height="32" rx="6" fill="#60a5fa" opacity="0.09"/>
  <text x="112" y="494" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#60a5fa">② 下载源码</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="112" y="532"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> wget https://git-core...</tspan></text>
    <text x="112" y="560"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> tar xzvf git-1.8.1.6.tar.gz</tspan></text>
  </g>

  <!-- Step 3 label -->
  <rect x="100" y="588" width="700" height="32" rx="6" fill="#f472b6" opacity="0.09"/>
  <text x="112" y="610" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#f472b6">③ 编译安装</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17">
    <text x="112" y="648"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> cd git-1.8.1.6</tspan></text>
    <text x="112" y="676"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> autoconf</tspan></text>
    <text x="112" y="704"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> ./configure</tspan></text>
    <text x="112" y="732"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> make</tspan></text>
    <text x="112" y="760"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> sudo make install</tspan></text>
  </g>

  <!-- Step 4: verify -->
  <rect x="100" y="780" width="700" height="32" rx="6" fill="#34d399" opacity="0.09"/>
  <text x="112" y="802" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> git --version</tspan></text>

  <!-- ============ right side: build pipeline visual ============ -->
  <!-- dep packages -->
  <rect x="900" y="260" width="620" height="160" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="932" y="302" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#fbbf24">yum 依赖</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="16">
    <text x="932" y="342" fill="#cbd5e1">gcc</text>
    <text x="996" y="342" fill="#94a3b8">·</text>
    <text x="1016" y="342" fill="#cbd5e1">curl-devel</text>
    <text x="1156" y="342" fill="#94a3b8">·</text>
    <text x="1176" y="342" fill="#cbd5e1">zlib-devel</text>
    <text x="932" y="374" fill="#cbd5e1">openssl-devel</text>
    <text x="1100" y="374" fill="#94a3b8">·</text>
    <text x="1120" y="374" fill="#cbd5e1">perl-devel</text>
    <text x="932" y="404" fill="#cbd5e1">expat-devel</text>
    <text x="1100" y="404" fill="#94a3b8">·</text>
    <text x="1120" y="404" fill="#cbd5e1">gettext-devel</text>
  </g>

  <!-- source tarball -->
  <rect x="900" y="460" width="620" height="140" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="932" y="502" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#60a5fa">源码包</text>
  <text x="932" y="542" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">git-1.8.1.6.tar.gz</text>
  <text x="932" y="578" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#5d6f92">yum 源中没有 git，需源码编译</text>

  <!-- build result -->
  <rect x="900" y="640" width="620" height="180" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <text x="932" y="682" font-family="SF Mono, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#f472b6">编译产物</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="932" y="722"><tspan fill="#34d399">autoconf</tspan><tspan fill="#4a5f92"> → </tspan><tspan fill="#94a3b8">生成 configure</tspan></text>
    <text x="932" y="756"><tspan fill="#34d399">./configure</tspan><tspan fill="#4a5f92"> → </tspan><tspan fill="#94a3b8">检测环境</tspan></text>
    <text x="932" y="790"><tspan fill="#34d399">make</tspan><tspan fill="#4a5f92"> → </tspan><tspan fill="#94a3b8">编译 C 源码</tspan></text>
    <text x="932" y="822"><tspan fill="#34d399">make install</tspan><tspan fill="#4a5f92"> → </tspan><tspan fill="#94a3b8">安装到 /usr/local</tspan></text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 1210 420 L 1210 450"/>
    <path d="M 1210 600 L 1210 630"/>
  </g>
</svg>
