<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8ea2c8" opacity="0.10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f92"/>
    </marker>
    <g id="lockGlyph" fill="currentColor">
      <rect x="-7" y="-1" width="14" height="10" rx="2.5"/>
      <path d="M-4,-1 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
    <g id="serverGlyph" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="-9" y="-10" width="18" height="8" rx="2"/>
      <rect x="-9" y="2" width="18" height="8" rx="2"/>
      <path d="M-5,-6 h2 M-5,6 h2"/>
    </g>
    <g id="routerGlyph" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="-10" y="0" width="20" height="9" rx="2"/>
      <path d="M-5,0 L-8,-10 M5,0 L8,-10 M-5,4.5 h2"/>
    </g>
    <g id="cloudGlyph" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round">
      <path d="M-10,7 h20 a6,6 0 0 0 0,-12 a8,8 0 0 0 -15,-2 a6,6 0 0 0 -5,14 z"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glowTL)"/>
  <rect width="1600" height="900" fill="url(#glowBR)"/>

  <!-- header -->
  <text x="80" y="152" font-family="SF Mono, Menlo, Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc">cloudflared</text>
  <rect x="675" y="88" width="14" height="66" rx="2" fill="#34d399" opacity="0.9"/>
  <text x="84" y="204" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" fill="#94a3b8">fake-ip · 旁路由路径 · 按目的地址加静态路由</text>
  <text x="1520" y="212" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" opacity="0.45">TLS handshake with edge error: EOF</text>

  <!-- ================= terminal card ================= -->
  <rect x="80" y="250" width="680" height="570" rx="16" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <line x1="80" y1="298" x2="760" y2="298" stroke="#27385e" stroke-width="1.5"/>
  <circle cx="112" cy="274" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="274" r="7" fill="#febc2e"/>
  <circle cx="168" cy="274" r="7" fill="#28c840"/>
  <text x="420" y="280" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" fill="#7d8ca8">fnOS — docker logs</text>

  <!-- highlighted fake-ip row -->
  <rect x="100" y="402" width="640" height="36" rx="8" fill="#fbbf24" opacity="0.09"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="112" y="348"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> docker logs -f cloudflared</tspan></text>
    <text x="112" y="390"><tspan fill="#f472b6">ERR</tspan><tspan fill="#cbd5e1"> TLS handshake with edge error: EOF</tspan></text>
    <text x="156" y="426"><tspan fill="#5d6f92">ip=</tspan><tspan fill="#fbbf24" font-weight="700">198.18.0.152</tspan><tspan fill="#5d6f92">   # Clash fake-ip</tspan></text>
    <text x="112" y="480"><tspan fill="#f472b6">ERR</tspan><tspan fill="#cbd5e1"> read tcp ...-&gt;198.41.192.107:7844</tspan></text>
    <text x="156" y="514"><tspan fill="#5d6f92">i/o timeout       # 走旁路由，时好时坏</tspan></text>
    <text x="112" y="568"><tspan fill="#34d399">$</tspan><tspan fill="#cbd5e1"> sudo ip route add 198.41.192.0/24 \</tspan></text>
    <text x="156" y="602"><tspan fill="#cbd5e1">via </tspan><tspan fill="#34d399">192.168.31.1</tspan><tspan fill="#5d6f92">  # 直走主路由</tspan></text>
    <text x="112" y="656"><tspan fill="#34d399">INF Registered tunnel connection</tspan></text>
  </g>

  <!-- chips -->
  <rect x="112" y="730" width="252" height="50" rx="10" fill="#1c2a4d" stroke="#fbbf24" stroke-opacity="0.55"/>
  <text x="238" y="762" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">fake-ip-filter</text>
  <rect x="384" y="730" width="252" height="50" rx="10" fill="#1c2a4d" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="510" y="762" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#34d399">--protocol http2</text>

  <!-- ================= connectors ================= -->
  <g fill="none" stroke="#4a5f92" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 1090 470 C 1180 470, 1170 318, 1262 318"/>
    <path d="M 1090 506 L 1262 506"/>
    <path d="M 1395 552 L 1395 698"/>
  </g>
  <text x="1124" y="370" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#94a3b8">默认网关</text>
  <use href="#lockGlyph" transform="translate(1176, 502)" color="#34d399"/>
  <text x="1176" y="538" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#94a3b8">静态路由</text>
  <text x="1412" y="632" font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">TCP :7844</text>

  <!-- ================= nodes ================= -->
  <!-- NAS -->
  <rect x="840" y="432" width="250" height="112" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <use href="#serverGlyph" transform="translate(882, 468)" color="#fbbf24"/>
  <text x="906" y="476" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">飞牛 NAS</text>
  <text x="872" y="514" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">192.168.31.36</text>

  <!-- side router -->
  <rect x="1270" y="262" width="250" height="112" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <use href="#routerGlyph" transform="translate(1304, 294)" color="#f472b6"/>
  <text x="1328" y="306" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f1f5f9">OpenClash</text>
  <text x="1302" y="344" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17"><tspan fill="#f472b6">旁路由</tspan><tspan fill="#94a3b8"> → 其他流量</tspan></text>

  <!-- main router -->
  <rect x="1270" y="440" width="250" height="112" rx="14" fill="#131d35" stroke="#27385e" stroke-width="1.5"/>
  <use href="#routerGlyph" transform="translate(1304, 472)" color="#34d399"/>
  <text x="1328" y="484" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">主路由</text>
  <text x="1302" y="522" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17" fill="#34d399">192.168.31.1</text>

  <!-- edge strip -->
  <rect x="840" y="708" width="680" height="112" rx="14" fill="#101a31" stroke="#27385e" stroke-width="1.5"/>
  <use href="#cloudGlyph" transform="translate(884, 746)" color="#fbbf24"/>
  <text x="912" y="754" font-family="SF Mono, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f1f5f9">Cloudflare edge</text>
  <text x="872" y="792" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17"><tspan fill="#fbbf24">198.41.192.0/24</tspan><tspan fill="#5d6f92"> · </tspan><tspan fill="#fbbf24">198.41.200.0/24</tspan></text>
</svg>
