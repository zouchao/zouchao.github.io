# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: zh-CN

timezone: Asia/Shanghai

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: 邹超的博客 # the main title

tagline: 记录、整理、分享 —— 一个程序猿的技术自留地 # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  邹超的博客，记录 web 开发与技术折腾：Ruby、Golang、PHP、git、macOS 工具链、Nix 等。

# Fill in the protocol & hostname for your site.
url: "https://zouchao.github.io"

github:
  username: zouchao

twitter:
  username: zouchao

social:
  name: 邹超
  email: zouchao2008@gmail.com
  links:
    # The first element serves as the copyright owner's link
    - https://github.com/zouchao
    - https://twitter.com/zouchao

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id: G-7Q2YWR8MFP # GA4 衡量 ID

# Page views settings
pageviews:
  provider: # now only supports 'goatcounter'

# Prefer color scheme setting.
# Keep empty will follow the system prefer color by default,
# and there will be a toggle to switch the theme between dark and light
# on the bottom left of the sidebar.
theme_mode: # [light | dark]

# the avatar on sidebar, support local or CORS resources
avatar: /assets/img/avatar.jpg

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  # 评论系统：giscus（基于 GitHub Discussions）› https://giscus.app/zh-CN
  provider: giscus # [disqus | utterances | giscus]
  giscus:
    repo: zouchao/zouchao.github.io
    repo_id: MDEwOlJlcG9zaXRvcnk5Njc2NTU0
    category: Announcements
    category_id: DIC_kwDOAJOnCs4DEuem
    mapping: pathname # 按文章 URL 匹配 Discussion，URL 稳定故评论不会串
    lang: zh-CN

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # boolean, keep empty means false

pwa:
  enabled: true # The option for PWA feature (installable)
  cache:
    enabled: true # The option for PWA offline cache

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # 保留旧站 permalink 风格，历史外链不会失效
      permalink: /:year/:month/:day/:title
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - README.md
  - newpost
  - vendor
  - "*.drawio"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
